  attn_implementation: "flash_attention_2"
  cache_dir: null
  image_token: "<|image_pad|>"
  model_max_length: null
  trainable_modules:
    visual: true
    visual_merger: true
    language_model: true

data:
  train_jsonl: "/workspace/code_dir/a_property/dataset/NAVIDA_pano/train_r2r_rxr_atomic_pano_full_history_ratio_10_5_5_3.jsonl"
  eval_jsonl: "/workspace/code_dir/a_property/dataset/NAVIDA_pano_eval/val_unseen_r2r_atomic_pano_full_history_ratio_60_18_18_4.jsonl"
  image_root: null
  train_image_root: "/workspace/code_dir/a_property/dataset/NAVIDA_pano"
  eval_image_root: "/workspace/code_dir/a_property/dataset/NAVIDA_pano_eval"
  train_max_samples: null
  eval_max_samples: 3000
  shuffle: true
  image_size: [640, 320]
  action_vocab: ["stop", "move_forward", "turn_left", "turn_right"]
  f1_action_weight: [1.0, 1.0, 1.0, 1.0]
  add_visual_prompt: false
  prompt_format: "chat_template"

training:
  output_dir: "/workspace/code_dir/a_property/model/Trained/erp_linear_mem_100_10"
  seed: 42
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
