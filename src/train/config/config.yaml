model:
  name_or_path: "/workspace/code/a_property/model/Qwen3.5-4B"
  trust_remote_code: false
  torch_dtype: "bfloat16"
  attn_implementation: "flash_attention_2"
  cache_dir: null
  image_token: "<|image_pad|>"
  model_max_length: null
  trainable_modules:
    visual: true
    visual_merger: true
    language_model: true
    erp_position_mlp: false
    panovggt_mlp: false
    action_bearing_kv: true
  erp_pos_enabled: false
  erp_pos_alpha_init: 0.02
  erp_pos_alpha_max: 0.1
  erp_apply_to_current_only: true
  panovggt_enabled: false
  panovggt_checkpoint_path: "/workspace/code/a_property/model/PanoVGGT/model.pt"
  panovggt_alpha_init: 0.2
  panovggt_alpha_max: 0.4
  panovggt_force_fp32: false
  action_bearing_enabled: true
  action_bearing_key_alpha_init: 0.01
  action_bearing_key_alpha_max: 0.02
  action_bearing_value_alpha_init: 0.04
  action_bearing_value_alpha_max: 0.08
  action_bearing_inject_layers: [3, 7, 11, 15, 19, 23, 27, 31]   #32  Both writing styles are compatible.

data:
  train_jsonl: "/workspace/data1/dataset/ablation/ebs/train_r2r_rxr_ebs_event050_bg005_tail080.jsonl"
  eval_jsonl: "/workspace/code/a_property/dataset/PanoVLN_eval/val_unseen_r2r_4action_pano_full_history_word_stop_pad.jsonl"
  train_image_root: "/workspace/code/a_property/dataset/PanoVLN"
  eval_image_root: "/workspace/code/a_property/dataset/PanoVLN_eval"
  train_max_samples: null
  eval_max_samples: 3000
  shuffle: true
  image_size: [640, 320]
  action_vocab: ["stop", "forward", "left", "right"]
  f1_action_weight: [1.0, 1.0, 1.0, 1.0]
  prompt_format: "chat_template"

training:
  output_dir: "/workspace/code/a_property/model/action_kv_k001_002_v004_008"
  seed: 42
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-5
  language_model_lr: 2.0e-5
  visual_lr: 5.0e-6
  visual_merger_lr: 2.0e-5
  erp_position_mlp_lr: 2.0e-5
  panovggt_mlp_lr: 2.0e-5
  action_bearing_kv_lr: 1.0e-5
  weight_decay: 0.01
  num_train_epochs: 1
  logging_steps: 5
  save_steps: 200
  eval_steps: 200
  max_steps: -1
  eval_strategy: "steps"
  save_strategy: "steps"
  max_shard_size: "50GB"
  load_best_model_at_end: false
  metric_for_best_model: "eval_weighted_action_f1"
  greater_is_better: true
  save_total_limit: 2
  warmup_steps: 0.03
  lr_scheduler_type: "cosine"
  fp16: false
  bf16: true
  optim: "adamw_torch_fused"
  report_to: ["wandb"]
  run_name: "panovln_action_kv_default_tail080"
  remove_unused_columns: false
  dataloader_num_workers: 6
  gradient_checkpointing: true
  max_grad_norm: 1.0
  deepspeed: "/workspace/code/VLN/scripts/zero2.json"

run:
  do_eval: true
  resume_from_checkpoint: true

wandb:
  project: "PanoVLN"
  entity: null
  name: "panovln_action_kv_default_tail080"
  tags: ["qwen3.5-4b", "r2r-rxr", "module-ablation", "action-kv", "ebs-event050-bg005-tail080", "4-action", "word-action", "stop-pad", "bf16", "flash", "4gpu", "global-batch-128"]
  mode: "offline"
  group: null
  notes: "Module ablation: action-bearing KV enabled on the selected EBS train_r2r_rxr_ebs_event050_bg005_tail080.jsonl dataset. PanoVGGT is disabled. Action KV alpha uses key init/max 0.02/0.05 and value init/max 0.05/0.10, injected at layers [3,7,11,15,19,23,27,31]. Uses bf16/flash on GPUs 0-3 with per_device_train_batch_size=4 and gradient_accumulation_steps=8 for global batch 128."
  id: null
  resume: "never"
