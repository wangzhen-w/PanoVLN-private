model:
  name_or_path: "/workspace/code_dir/a_property/model/Qwen3.5-4B"
  trust_remote_code: false
  torch_dtype: "bfloat16"
  attn_implementation: "flash_attention_2"
  cache_dir: null
  image_token: "<|image_pad|>"
  model_max_length: null
  trainable_modules:
    visual: true
    visual_merger: true
    language_model: true
    panovggt_mlp: true
    action_bearing_kv: false
  panovggt_enabled: true
  panovggt_checkpoint_path: "/workspace/code_dir/a_property/model/PanoVGGT/model.pt"
  panovggt_alpha_init: 0.2
  panovggt_alpha_max: 0.4
  panovggt_force_fp32: true
  action_bearing_enabled: false
  action_bearing_key_alpha_init: 0.02
  action_bearing_key_alpha_max: 0.05
  action_bearing_value_alpha_init: 0.05
  action_bearing_value_alpha_max: 0.1
  action_bearing_inject_layers: 32

data:
  train_jsonl: "/workspace/code_dir/a_property/dataset/PanoVLN/train_r2r_rxr_4action_stop_pad_ebs_event0p50_bg0p05_taildense4.jsonl"
  eval_jsonl: "/workspace/code_dir/a_property/dataset/PanoVLN_eval/val_unseen_r2r_4action_pano_full_history_word_stop_pad.jsonl"
  train_image_root: "/workspace/code_dir/a_property/dataset/PanoVLN"
  eval_image_root: "/workspace/code_dir/a_property/dataset/PanoVLN_eval"
  train_max_samples: null
  eval_max_samples: 3000
  shuffle: true
  image_size: [640, 320]
  action_vocab: ["stop", "forward", "left", "right"]
  f1_action_weight: [1.0, 1.0, 1.0, 1.0]
  prompt_format: "chat_template"

training:
  output_dir: "/workspace/code_dir/a_property/model/4-action/panovln_ebs_panovggt_repeat_fp32"
  seed: 42
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-5
  weight_decay: 0.01
  num_train_epochs: 1
  logging_steps: 5
  save_steps: 200
  eval_steps: 200
  max_steps: -1
  eval_strategy: "steps"
  save_strategy: "steps"
  max_shard_size: "50GB"
  load_best_model_at_end: false
  metric_for_best_model: "eval_weighted_action_f1"
  greater_is_better: true
  save_total_limit: 2
  warmup_steps: 0.03
  lr_scheduler_type: "cosine"
  fp16: false
  bf16: true
  optim: "adamw_torch_fused"
  report_to: ["wandb"]
  run_name: "panovln_ebs_panovggt_repeat_fp32_flash_noaction"
  remove_unused_columns: false
  dataloader_num_workers: 4
  gradient_checkpointing: true
  max_grad_norm: 1.0
  deepspeed: "/workspace/code_dir/VLN/scripts/zero2.json"

run:
  do_eval: true
  resume_from_checkpoint: true

wandb:
  project: "PanoVLN"
  entity: null
  name: "panovln_ebs_panovggt_repeat_fp32_flash_noaction"
  tags: ["qwen3.5", "r2r", "rxr", "word-action", "stop-pad", "EBS", "event-balanced-sampling", "event0p50", "bg0p05", "taildense4", "panovggt-geometry", "panovggt-current-only", "panovggt-fp32", "flash", "no-action-module", "4gpu", "global-batch-128"]
  mode: "offline"
  group: null
  notes: "PanoVGGT-only repeat with Qwen bf16/flash and frozen PanoVGGT kept in fp32 for legacy behavior. Action-Bearing KV is disabled and not instantiated in the model. Uses GPUs 0-3 with per_device_train_batch_size=4 and gradient_accumulation_steps=8 for global batch 128."
  id: null
  resume: "never"
