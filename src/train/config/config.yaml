model:
  name_or_path: "/workspace/code/a_property/model/Qwen3.5-4B"
  trust_remote_code: false
  torch_dtype: "bfloat16"
  attn_implementation: "flash_attention_2"
  cache_dir: null
  image_token: "<|image_pad|>"
  model_max_length: null
  trainable_modules:
    visual: true
    visual_merger: true
    language_model: true
    panovggt_mlp: true
    action_bearing_kv: false
  panovggt_enabled: true
  panovggt_checkpoint_path: "/workspace/code/a_property/model/PanoVGGT/model.pt"
  panovggt_alpha_init: 0.2
  panovggt_alpha_max: 0.4
  panovggt_force_fp32: false
  action_bearing_enabled: false
  action_bearing_key_alpha_init: 0.01
  action_bearing_key_alpha_max: 0.03
  action_bearing_value_alpha_init: 0.03
  action_bearing_value_alpha_max: 0.08
  action_bearing_inject_layers: [3, 7, 11, 15, 19, 23, 27, 31]   #32  Both writing styles are compatible.

data:
  train_jsonl: "/workspace/code/a_property/dataset/PanoVLN/train_r2r_rxr_ebs_event050_bg005_tail100_taildense4.jsonl"
  eval_jsonl: "/workspace/code/a_property/dataset/PanoVLN_eval/val_unseen_r2r_4action_pano_full_history_word_stop_pad.jsonl"
  train_image_root: "/workspace/code/a_property/dataset/PanoVLN"
  eval_image_root: "/workspace/code/a_property/dataset/PanoVLN_eval"
  train_max_samples: null
  eval_max_samples: 3000
  shuffle: true
  image_size: [640, 320]
  action_vocab: ["stop", "forward", "left", "right"]
  f1_action_weight: [1.0, 1.0, 1.0, 1.0]
  prompt_format: "chat_template"

training:
  output_dir: "/workspace/code/a_property/model/panovln_ebs_panovggt_again"
  seed: 42
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-5
  language_model_lr: 2.0e-5
  visual_lr: 2.0e-5
  visual_merger_lr: 2.0e-5
  panovggt_mlp_lr: 2.0e-5
  action_bearing_kv_lr: 1.0e-5
  weight_decay: 0.01
  num_train_epochs: 1
  logging_steps: 5
  save_steps: 200
  eval_steps: 200
  max_steps: -1
  eval_strategy: "steps"
  save_strategy: "steps"
  max_shard_size: "50GB"
  load_best_model_at_end: false
  metric_for_best_model: "eval_weighted_action_f1"
  greater_is_better: true
  save_total_limit: 2
  warmup_steps: 0.03
  lr_scheduler_type: "cosine"
  fp16: false
  bf16: true
  optim: "adamw_torch_fused"
  report_to: ["wandb"]
  run_name: "panovln_ebs_panovggt_action_kv_joint_lr1e5_visual2e6"
  remove_unused_columns: false
  dataloader_num_workers: 6
  gradient_checkpointing: true
  max_grad_norm: 1.0
  deepspeed: "/workspace/code/VLN/scripts/zero2.json"

run:
  do_eval: true
  resume_from_checkpoint: true

wandb:
  project: "PanoVLN"
  entity: null
  name: "panovln_ebs_panovggt_action_kv_joint_lr1e5_visual2e6"
  tags: ["qwen3.5-4b", "r2r-rxr", "ebs", "one-shot-joint-train", "word-action", "stop-pad", "panovggt-geometry", "action-bearing-kv", "action-kv-full-attn-3-7-11-15-19-23-27-31", "panovggt-alpha0p2-max0p4", "action-alpha-key0p01-value0p03", "lm-lr1e-5", "visual-lr2e-6", "merger-lr1e-5", "panovggt-lr1e-5", "action-kv-lr1e-5", "warmup-0p03", "bf16", "flash", "4gpu", "global-batch-128"]
  mode: "offline"
  group: null
  notes: "One-shot joint training from /workspace/code_dir/a_property/model/Qwen3.5-4B on the R2R+RxR EBS dataset train_r2r_rxr_ebs_event050_bg005_tail100_taildense4.jsonl. PanoVGGT and action-bearing KV are enabled from the start instead of continuing from a PanoVGGT-only checkpoint. Module-wise LR: language_model=1e-5, visual=2e-6, visual_merger=1e-5, panovggt_mlp=1e-5, action_bearing_kv=1e-5. Action KV explicitly injects Qwen full-attention decoder layers [3, 7, 11, 15, 19, 23, 27, 31] with key/value alpha init 0.01/0.03 and max 0.03/0.08. PanoVGGT alpha init/max is 0.2/0.4. Uses bf16/flash on GPUs 0-3 with per_device_train_batch_size=4 and gradient_accumulation_steps=8 for global batch 128."
  id: null
  resume: "never"
