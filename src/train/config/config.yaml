model:
  name_or_path: "/workspace/data1/model/panoworld/panovln_panovggt_1e-6"
  trust_remote_code: false
  torch_dtype: "bfloat16"
  attn_implementation: "flash_attention_2"
  cache_dir: null
  image_token: "<|image_pad|>"
  model_max_length: null
  trainable_modules:
    visual: true
    visual_merger: true
    language_model: true
    erp_fourier_linear_adapter: false
    panovggt_mlp: true
  erp_top_crop_degrees: 20.0
  erp_bottom_crop_degrees: 20.0
  erp_fourier_linear_enabled: false
  erp_fourier_linear_alpha_value: 0.005
  panovggt_enabled: true
  panovggt_checkpoint_path: "/workspace/code/a_property/model/PanoVGGT/model.pt"
  panovggt_alpha_value: 0.05
  panovggt_sampling_mode: "grouping"    #"singlepoint"每个 Qwen token 采一个 PanoVGGT C token / "grouping"2x2 四个 C 拼接
  panovggt_force_fp32: false

data:
  train_jsonl: "/workspace/data1/dataset/ablation/ebs/train_r2r_rxr_ebs_event050_bg005_tail080.jsonl"
  eval_jsonl: "/workspace/code/a_property/dataset/PanoVLN_eval/val_unseen_r2r_4action_pano_full_history_word_stop_pad.jsonl"
  train_image_root: "/workspace/code/a_property/dataset/PanoVLN"
  eval_image_root: "/workspace/code/a_property/dataset/PanoVLN_eval"
  train_max_samples: null
  eval_max_samples: 3000
  shuffle: true
  action_vocab: ["stop", "forward", "left", "right"]
  f1_action_weight: [1.0, 1.0, 1.0, 1.0]
  prompt_format: "chat_template"
  panoworld:
    enabled: true
    jsonl: "/workspace/data1/dataset/Panoworld/train_outdoor.jsonl"
    image_root: "/workspace/data1/dataset/Panoworld"
    keep_ratio: 1.0  #panoworld自己数据集的比例，全量panoworld有361k数据

training:
  output_dir: "/workspace/data1/model/ablation_new/panovggt_new/panovggt_0.05_panoworld_8card"
  seed: 42
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-5
  language_model_lr: 2.0e-5
  visual_lr: 2e-6
  visual_merger_lr: 1.0e-5
  erp_fourier_linear_lr: 1.0e-5
  panovggt_mlp_lr: 1.0e-5
  weight_decay: 0.01
  num_train_epochs: 1
  logging_steps: 5
  save_steps: 200
  eval_steps: 200
  max_steps: -1
  eval_strategy: "steps"
  save_strategy: "steps"
  max_shard_size: "50GB"
  load_best_model_at_end: true
  metric_for_best_model: "eval_weighted_action_f1"
  greater_is_better: true
  save_total_limit: 2
  warmup_steps: 0.03  #new huggingface version
  lr_scheduler_type: "cosine"
  fp16: false
  bf16: true
  optim: "adamw_torch_fused"
  report_to: ["wandb"]
  run_name: null
  remove_unused_columns: false
  dataloader_num_workers: 6
  gradient_checkpointing: true
  max_grad_norm: 0.5
  deepspeed: "/workspace/code/VLN/scripts/zero2.json"

run:
  do_eval: true
  resume_from_checkpoint: false

wandb:
  project: "PanoVLN"
  entity: null
  name: null
  tags: null
  mode: "offline"
  group: null
  notes: null
  id: null
  resume: "never"
