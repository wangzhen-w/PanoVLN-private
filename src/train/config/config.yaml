model:
  name_or_path: "/workspace/code/a_property/model/Qwen3.5-4B"
  trust_remote_code: false
  torch_dtype: "bfloat16"
  attn_implementation: "flash_attention_2"
  cache_dir: null
  image_token: "<|image_pad|>"
  model_max_length: null
  trainable_modules:
    visual: true
    visual_merger: true
    language_model: true
    erp_position_mlp: false
    panovggt_mlp: true
    action_bearing_kv: false
  erp_pos_enabled: false
  erp_pos_alpha_value: 0.02
  erp_apply_to_current_only: true
  erp_top_crop_degrees: 20.0
  erp_bottom_crop_degrees: 20.0
  panovggt_enabled: true
  panovggt_checkpoint_path: "/workspace/code/a_property/model/PanoVGGT/model.pt"
  panovggt_alpha_value: 0.1
  panovggt_sampling_mode: "grouping"    #"singlepoint"每个 Qwen token 采一个 PanoVGGT C token / "grouping"2x2 四个 C 拼接
  panovggt_force_fp32: false
  action_bearing_enabled: false
  action_bearing_key_alpha_value: 0.01
  action_bearing_value_alpha_value: 0.05
  action_bearing_inject_layers: [3, 7, 11, 15, 19, 23, 27, 31]   #32  Both writing styles are compatible.

data:
  train_jsonl: "/workspace/data1/dataset/ablation/ebs/train_r2r_rxr_ebs_event050_bg005_tail080.jsonl"
  eval_jsonl: "/workspace/code/a_property/dataset/PanoVLN_eval/val_unseen_r2r_4action_pano_full_history_word_stop_pad.jsonl"
  train_image_root: "/workspace/code/a_property/dataset/PanoVLN"
  eval_image_root: "/workspace/code/a_property/dataset/PanoVLN_eval"
  train_max_samples: null
  eval_max_samples: 3000
  shuffle: true
  action_vocab: ["stop", "forward", "left", "right"]
  f1_action_weight: [1.0, 1.0, 1.0, 1.0]
  prompt_format: "chat_template"

training:
  output_dir: "/workspace/code/a_property/model/panovggt_grouping_visual2e-6_merger2e-5_mlp1e-5"
  seed: 42
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-5
  language_model_lr: 2.0e-5
  visual_lr: 2.0e-6
  visual_merger_lr: 2.0e-5
  erp_position_mlp_lr: 1.0e-5
  panovggt_mlp_lr: 1.0e-5
  action_bearing_kv_lr: 1.0e-5
  weight_decay: 0.01
  num_train_epochs: 1
  logging_steps: 5
  save_steps: 200
  eval_steps: 200
  max_steps: -1
  eval_strategy: "steps"
  save_strategy: "steps"
  max_shard_size: "50GB"
  load_best_model_at_end: false
  metric_for_best_model: "eval_weighted_action_f1"
  greater_is_better: true
  save_total_limit: 2
  warmup_steps: 0.03
  lr_scheduler_type: "cosine"
  fp16: false
  bf16: true
  optim: "adamw_torch_fused"
  report_to: ["wandb"]
  run_name: "qwen35_4b_panovggt_grouping_pano840x420_event050_bg005_tail080_visual2e-6_merger1e-5_mlp1e-5"
  remove_unused_columns: false
  dataloader_num_workers: 6
  gradient_checkpointing: true
  max_grad_norm: 1.0
  deepspeed: "/workspace/code/VLN/scripts/zero2.json"

run:
  do_eval: true
  resume_from_checkpoint: false

wandb:
  project: "PanoVLN"
  entity: null
  name: "qwen35_4b_panovggt_grouping_pano840x420_event050_bg005_tail080_visual2e-6_merger1e-5_mlp1e-5"
  tags: ["qwen3.5-4b", "r2r-rxr", "module-ablation", "panovggt", "grouping", "janusvln-style", "pano840x420", "alpha-value-0.1", "raw-qwen-init", "ebs-event050-bg005-tail080", "visual-lr-2e-6", "merger-lr-1e-5", "panovggt-mlp-lr-1e-5", "4-action", "word-action", "stop-pad", "bf16", "flash", "4gpu", "global-batch-128"]
  mode: "offline"
  group: null
  notes: "PanoVGGT JanusVLN-style grouping alpha-value run from raw Qwen3.5-4B with PanoVGGT input resized to 840x420 while Qwen current observation stays 960x480. Each Qwen visual token uses the corresponding 2x2 PanoVGGT embeddings concatenated before the MLP. PanoVGGT backbone frozen; PanoVGGT MLP, visual, visual merger, and language model are trainable. Uses visual_lr=2e-6, visual_merger_lr=1e-5, panovggt_mlp_lr=1e-5, panovggt_alpha_value=0.1 on train_r2r_rxr_ebs_event050_bg005_tail080.jsonl with bf16/flash on GPUs 0-3, per_device_train_batch_size=4, gradient_accumulation_steps=8, global batch 128."
  id: null
  resume: "never"
