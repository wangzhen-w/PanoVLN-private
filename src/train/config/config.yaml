model:
  name_or_path: "/workspace/code/a_property/model/Qwen3.5-4B"
  trust_remote_code: false
  torch_dtype: "bfloat16"
  attn_implementation: "flash_attention_2"
  cache_dir: null
  image_token: "<|image_pad|>"
  model_max_length: null
  action_sequence_length: 18       # ablation: 1 / 2 / 4 / 6 / 8 / 10 / 12 / 14 / 16 / 18 / 24 / 36; saved to model config.json
  view_mode: "panorama"           # "panorama" or runtime ERP-to-"perspective" projection
  perspective_xfov_degrees: 90.0
  perspective_yfov_degrees: 90.0
  perspective_image_width: 320
  perspective_image_height: 320
  trainable_modules:
    visual: true
    visual_merger: true
    language_model: true
    panovggt_mlp: false
    pbo_head: false
  erp_top_crop_degrees: 20.0
  erp_bottom_crop_degrees: 20.0
  panovggt_enabled: false
  panovggt_checkpoint_path: "/workspace/code/a_property/model/PanoVGGT/model.pt"
  panovggt_alpha_value: 0.20
  panovggt_feature_source: "aggregator"  #"aggregator"共享主干2048维latent / "point_hidden"point decoder后的1024维hidden
  panovggt_injection_stage: "pre_merger"  #"post_merger"加到Qwen merger后2560维visual token / "pre_merger"加到Qwen merger前1024维patch token
  panovggt_sampling_mode: "singlepoint"    #"singlepoint"每个 Qwen token 采一个 PanoVGGT token / "grouping"每个 Qwen token 聚合局部2x2 PanoVGGT latent
  panovggt_force_fp32: false
  pbo_enabled: false
  pbo_loss_weight: 0.1
  pbo_head_hidden_size: 512

data:
  train_jsonl: "/workspace/data2/dataset/ablation/18-action/train_r2r_rxr_h18_stop_1-6_stride1_7-18_stride2_seed42.jsonl"
  eval_jsonl: "/workspace/code/a_property/dataset/PanoVLN_eval/val_unseen_r2r_4action_pano_full_history_word_stop_pad.jsonl"
  train_image_root: "/workspace/code/a_property/dataset/PanoVLN"
  eval_image_root: "/workspace/code/a_property/dataset/PanoVLN_eval"
  train_max_samples: null
  eval_max_samples: 3000
  shuffle: true
  action_vocab: ["stop", "forward", "left", "right"]
  f1_action_weight: [1.0, 1.0, 1.0, 1.0]
  prompt_format: "chat_template"
  panoworld:
    enabled: false
    jsonl: "/workspace/data2/dataset/ablation/data/train_panowrold.jsonl"
    image_root: "/workspace/data2/dataset/Panoworld"
    keep_ratio: 1.0
    mixing_strategy: "task"  #"sample"同一batch里有不同类型数据    "task"同一batch仅一个类型的训练数据

training:
  output_dir: "/workspace/data2/model/18-action/base_18action_padding_loss_weight0.1"
  seed: 42
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-5
  language_model_lr: 2.0e-5
  visual_lr: 2.0e-6
  visual_merger_lr: 1.0e-5
  panovggt_mlp_lr: 2.0e-5
  pbo_head_lr: 2.0e-5
  padding_stop_loss_weight: 0.1
  weight_decay: 0.01
  num_train_epochs: 1
  logging_steps: 5
  save_steps: 1000
  eval_steps: 1000
  max_steps: -1
  eval_strategy: "no"
  save_strategy: "steps"
  save_model_at_end: true
  max_shard_size: "50GB"
  load_best_model_at_end: false
  metric_for_best_model: null
  greater_is_better: null
  save_total_limit: 2
  warmup_steps: 0.03  #new huggingface version
  lr_scheduler_type: "cosine"
  fp16: false
  bf16: true
  optim: "adamw_torch_fused"
  report_to: ["wandb"]
  remove_unused_columns: false
  dataloader_num_workers: 6
  gradient_checkpointing: true
  max_grad_norm: 10.0
  deepspeed: "/workspace/code/VLN/scripts/zero2.json"

run:
  do_eval: false
  resume_from_checkpoint: false

wandb:
  project: "PanoVLN"
  mode: "offline"
  resume: "never"
