model:
  name_or_path: "/workspace/code_dir/a_property/model/Qwen3.5-4B"
  trust_remote_code: false
  torch_dtype: "bfloat16"
  attn_implementation: "flash_attention_2"
  cache_dir: null
  image_token: "<|image_pad|>"
  model_max_length: null
  trainable_modules:
    visual: true
    visual_merger: true
    language_model: true

data:
  train_jsonl: "/workspace/code_dir/a_property/dataset/NAVIDA_pano/train_r2r_rxr_4action_pano_full_history_word_balanced_subset_v2.jsonl"
  eval_jsonl: "/workspace/code_dir/a_property/dataset/NAVIDA_pano_eval/val_unseen_r2r_4action_pano_full_history_word.jsonl"
  train_image_root: "/workspace/code_dir/a_property/dataset/NAVIDA_pano"
  eval_image_root: "/workspace/code_dir/a_property/dataset/NAVIDA_pano_eval"
  train_max_samples: null
  eval_max_samples: 3000
  shuffle: true
  image_size: [640, 320]
  action_vocab: ["stop", "forward", "left", "right"]
  f1_action_weight: [1.0, 1.0, 1.0, 1.0]
  prompt_format: "chat_template"

training:
  output_dir: "/workspace/code_dir/a_property/model/4-action/word_space_balanced_subset_100_10"
  seed: 42
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-5
  weight_decay: 0.01
  num_train_epochs: 1
  logging_steps: 5
  save_steps: 200
  eval_steps: 200
  max_steps: -1
  eval_strategy: "steps"
  save_strategy: "steps"
  max_shard_size: "50GB"
  load_best_model_at_end: true
  metric_for_best_model: "eval_weighted_action_f1"
  greater_is_better: true
  save_total_limit: 2
  warmup_steps: 0.03
  lr_scheduler_type: "cosine"
  fp16: false
  bf16: true
  optim: "adamw_torch_fused"
  report_to: ["wandb"]
  run_name: "word_space_balanced_subset_window100_4action"
  remove_unused_columns: false
  dataloader_num_workers: 4
  gradient_checkpointing: true
  max_grad_norm: 1.0
  deepspeed: "/workspace/code_dir/VLN/scripts/zero2.json"

run:
  do_eval: true
  resume_from_checkpoint: false

wandb:
  project: "NAVIDA_pano"
  entity: null
  name: "word_space_balanced_subset_window100_4action"
  tags: ["qwen3.5", "r2r", "rxr", "word-action", "balanced-prefix"]
  mode: "offline"
  group: null
  notes: "Space-separated action-word targets with up to 4 future actions; no-replacement prefix-balanced subset from stride-4 chunks."
  id: null
  resume: "never"
