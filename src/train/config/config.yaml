model:
  name_or_path: "/workspace/code/a_property/model/Qwen3.5-4B"
  trust_remote_code: false
  torch_dtype: "bfloat16"
  attn_implementation: "flash_attention_2"
  cache_dir: null
  image_token: "<|image_pad|>"
  model_max_length: null
  trainable_modules:
    visual: true
    visual_merger: true
    language_model: true
    erp_fourier_linear_adapter: false
    unik3d_mlp: true
  erp_top_crop_degrees: 20.0
  erp_bottom_crop_degrees: 20.0
  erp_fourier_linear_enabled: false
  erp_fourier_linear_alpha_value: 0.01
  erp_fourier_linear_apply_to_current_only: true
  unik3d_enabled: true
  unik3d_source_path: "bundled"
  unik3d_model_path: "/workspace/data1/model/UniK3D-Large"
  unik3d_alpha_value: 0.20
  unik3d_feature_source: "decoder_multiscale" # 拼接三层ray-conditioned decoder特征，共896维
  unik3d_injection_stage: "pre_merger"  #"post_merger"加到Qwen merger后2560维visual token / "pre_merger"加到Qwen merger前1024维patch token
  unik3d_sampling_mode: "singlepoint"    #"singlepoint"每个 Qwen token 采一个 UniK3D token / "grouping"每个 Qwen token 聚合局部2x2 UniK3D latent
  unik3d_force_fp32: false
  unik3d_encoder_chunk_size: 2            # 只拆分冻结的UniK3D前向，Qwen micro-batch仍为4

data:
  train_jsonl: "/workspace/data1/dataset/ablation/ebs/train_r2r_rxr_ebs_event050_bg005_tail080.jsonl"
  eval_jsonl: "/workspace/code/a_property/dataset/PanoVLN_eval/val_unseen_r2r_4action_pano_full_history_word_stop_pad.jsonl"
  train_image_root: "/workspace/code/a_property/dataset/PanoVLN"
  eval_image_root: "/workspace/code/a_property/dataset/PanoVLN_eval"
  train_max_samples: null
  eval_max_samples: 3000
  shuffle: true
  action_vocab: ["stop", "forward", "left", "right"]
  f1_action_weight: [1.0, 1.0, 1.0, 1.0]
  prompt_format: "chat_template"
  panoworld:
    enabled: false
    jsonl: "/workspace/data1/dataset/Panoworld/train_outdoor.jsonl"
    image_root: "/workspace/data1/dataset/Panoworld"
    keep_ratio: 1.0
    mixing_strategy: "sample"  #"sample"同一batch里有不同类型数据    "task"同一batch仅一个类型的训练数据

training:
  output_dir: "/workspace/code/a_property/model/Unik3D-multiscale"
  seed: 42
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-5
  language_model_lr: 2.0e-5
  visual_lr: 2e-6
  visual_merger_lr: 1.0e-5
  erp_fourier_linear_lr: null
  unik3d_mlp_lr: 2.0e-5
  weight_decay: 0.01
  num_train_epochs: 1
  logging_steps: 5
  save_steps: 200
  eval_steps: 200
  max_steps: -1
  eval_strategy: "no"
  save_strategy: "steps"
  save_model_at_end: true
  max_shard_size: "50GB"
  load_best_model_at_end: false
  metric_for_best_model: null
  greater_is_better: null
  save_total_limit: 2
  warmup_steps: 0.03  #new huggingface version
  lr_scheduler_type: "cosine"
  fp16: false
  bf16: true
  optim: "adamw_torch_fused"
  report_to: ["wandb"]
  run_name: null
  remove_unused_columns: false
  dataloader_num_workers: 6
  gradient_checkpointing: true
  max_grad_norm: 1.0
  deepspeed: "/workspace/code/VLN/scripts/zero2.json"

run:
  do_eval: false
  resume_from_checkpoint: true

wandb:
  project: "PanoVLN"
  entity: null
  name: null
  tags: null
  mode: "offline"
  group: null
  notes: null
  id: null
  resume: "never"
