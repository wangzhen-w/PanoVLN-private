model:
  name_or_path: "/workspace/code/a_property/model/Qwen3.5-4B"
  trust_remote_code: false
  torch_dtype: "bfloat16"
  attn_implementation: "flash_attention_2"
  cache_dir: null
  image_token: "<|image_pad|>"
  model_max_length: null
  trainable_modules:
    visual: true
    visual_merger: true
    language_model: true
    panovggt_mlp: true
    action_calibrator: true
  panovggt_enabled: true
  panovggt_checkpoint_path: "/workspace/code/a_property/model/PanoVGGT/model.pt"
  panovggt_alpha_init: 0.2
  panovggt_alpha_max: 0.4
  panovggt_force_fp32: false
  action_calibrator_enabled: true
  action_calibrator_hidden_size: 32
  action_calibrator_max_delta: 0.35
  action_calibrator_delta_scale: 1.0
  action_calibrator_l2_weight: 1.0e-4
  action_calibrator_turn_angle_deg: 15.0
  action_calibrator_inference_enabled: true
  action_calibrator_attention_layer_indices: [19, 23, 27, 31]
  action_calibrator_step_decay: [1.0, 0.75, 0.55, 0.40]

data:
  train_jsonl: "/workspace/code/a_property/dataset/PanoVLN/train_r2r_rxr_ebs_event050_bg005_tail100_taildense4.jsonl"
  eval_jsonl: "/workspace/code/a_property/dataset/PanoVLN_eval/val_unseen_r2r_4action_pano_full_history_word_stop_pad.jsonl"
  train_image_root: "/workspace/code/a_property/dataset/PanoVLN"
  eval_image_root: "/workspace/code/a_property/dataset/PanoVLN_eval"
  train_max_samples: null
  eval_max_samples: 3000
  shuffle: true
  image_size: [640, 320]
  action_vocab: ["stop", "forward", "left", "right"]
  f1_action_weight: [1.0, 1.0, 1.0, 1.0]
  prompt_format: "chat_template"

training:
  output_dir: "/workspace/code/a_property/model/panovln_ebs_panovggt_paac"
  seed: 42
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-5
  language_model_lr: 2.0e-5
  visual_lr: 5.0e-6
  visual_merger_lr: 2.0e-5
  panovggt_mlp_lr: 2.0e-5
  action_calibrator_lr: 2.0e-5
  weight_decay: 0.01
  num_train_epochs: 1
  logging_steps: 5
  save_steps: 200
  eval_steps: 200
  max_steps: -1
  eval_strategy: "steps"
  save_strategy: "steps"
  max_shard_size: "50GB"
  load_best_model_at_end: false
  metric_for_best_model: "eval_weighted_action_f1"
  greater_is_better: true
  save_total_limit: 2
  warmup_steps: 0.03
  lr_scheduler_type: "cosine"
  fp16: false
  bf16: true
  optim: "adamw_torch_fused"
  report_to: ["wandb"]
  run_name: "panovln_ebs_panovggt_paac"
  remove_unused_columns: false
  dataloader_num_workers: 6
  gradient_checkpointing: true
  max_grad_norm: 1.0
  deepspeed: "/workspace/code/VLN/scripts/zero2.json"

run:
  do_eval: true
  resume_from_checkpoint: true

wandb:
  project: "PanoVLN"
  entity: null
  name: "panovln_ebs_panovggt_paac"
  tags: ["qwen3.5-4b", "r2r-rxr", "ebs", "one-shot-joint-train", "word-action", "stop-pad", "panovggt-geometry", "paac", "attention-to-action", "lm-lr2e-5", "visual-lr5e-6", "merger-lr2e-5", "panovggt-lr2e-5", "calibrator-lr2e-5", "warmup-0p03", "bf16", "eager-attn", "4gpu", "global-batch-128"]
  mode: "offline"
  group: null
  notes: "One-shot joint training from /workspace/code/a_property/model/Qwen3.5-4B on the R2R+RxR EBS dataset. PanoVGGT geometry and PAAC/ActionCalibrator are enabled from the start. PAAC reads the model's existing decoder attention from action-query positions to current panorama image tokens, pools the attention over the 360-degree yaw ring into directional evidence and confidence features, then adds a bounded zero-mean residual only to forward/left/right logits before CE; stop is left to the base LM head. Module-wise LR: language_model=2e-5, visual=5e-6, visual_merger=2e-5, panovggt_mlp=2e-5, action_calibrator=2e-5."
  id: null
  resume: "never"
