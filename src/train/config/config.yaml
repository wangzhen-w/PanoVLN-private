model:
  name_or_path: "/workspace/code/a_property/model/Qwen3.5-4B"
  trust_remote_code: false
  torch_dtype: "bfloat16"
  attn_implementation: "flash_attention_2"
  cache_dir: null
  image_token: "<|image_pad|>"
  model_max_length: null
  trainable_modules:
    visual: true
    visual_merger: true
    language_model: true
    action_bearing_residual: false
    paqr: true
    panovggt_mlp: true
  erp_top_crop_degrees: 20.0
  erp_bottom_crop_degrees: 20.0
  action_bearing_enabled: false
  action_bearing_alpha_init: 0.02
  action_bearing_alpha_max: 0.1
  paqr_enabled: true
  paqr_variant: "full"
  paqr_action_token_ids: [2282, 13048, 1246]  # left, forward, right 的首动作 LM-head 行
  paqr_stop_token_id: 9215
  paqr_reader_dim: 256
  paqr_prior_init: 0.02
  paqr_prior_max: 0.25
  paqr_first_action_only: true
  panovggt_enabled: true
  panovggt_checkpoint_path: "/workspace/code/a_property/model/PanoVGGT/model.pt"
  panovggt_alpha_value: 0.20
  panovggt_feature_source: "aggregator"  #"aggregator"共享主干2048维latent / "point_hidden"point decoder后的1024维hidden
  panovggt_injection_stage: "pre_merger"  #"post_merger"加到Qwen merger后2560维visual token / "pre_merger"加到Qwen merger前1024维patch token
  panovggt_sampling_mode: "singlepoint"    #"singlepoint"每个 Qwen token 采一个 PanoVGGT token / "grouping"每个 Qwen token 聚合局部2x2 PanoVGGT latent
  panovggt_force_fp32: false

data:
  train_jsonl: "/workspace/data2/dataset/ablation/ebs/train_r2r_rxr_ebs_event050_bg005_tail080.jsonl"
  eval_jsonl: "/workspace/code/a_property/dataset/PanoVLN_eval/val_unseen_r2r_4action_pano_full_history_word_stop_pad.jsonl"
  train_image_root: "/workspace/z_PanoVLN"
  eval_image_root: "/workspace/code/a_property/dataset/PanoVLN_eval"
  train_max_samples: null
  eval_max_samples: 3000
  shuffle: true
  action_vocab: ["stop", "forward", "left", "right"]
  f1_action_weight: [1.0, 1.0, 1.0, 1.0]
  prompt_format: "chat_template"
  panoworld:
    enabled: false
    jsonl: "/workspace/data1/dataset/Panoworld/train_outdoor.jsonl"
    image_root: "/workspace/data1/dataset/Panoworld"
    keep_ratio: 1.0
    mixing_strategy: "sample"  #"sample"同一batch里有不同类型数据    "task"同一batch仅一个类型的训练数据

training:
  output_dir: "/workspace/data2/model/ablation_new/action_new/panovggt_0.20_lr2e-5_singlepoint_fullpaqr_lr2e-5_8card"
  seed: 42
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-5
  language_model_lr: 2.0e-5
  visual_lr: 2e-6
  visual_merger_lr: 1.0e-5
  action_bearing_residual_lr: 2.0e-5
  paqr_lr: 2.0e-5
  panovggt_mlp_lr: 2.0e-5
  weight_decay: 0.01
  num_train_epochs: 1
  logging_steps: 5
  save_steps: 200
  eval_steps: 200
  max_steps: -1
  eval_strategy: "no"
  save_strategy: "steps"
  save_model_at_end: true
  max_shard_size: "50GB"
  load_best_model_at_end: false
  metric_for_best_model: null
  greater_is_better: null
  save_total_limit: 2
  warmup_steps: 0.03  #new huggingface version
  lr_scheduler_type: "cosine"
  fp16: false
  bf16: true
  optim: "adamw_torch_fused"
  report_to: ["wandb"]
  run_name: "panovggt_0.20_lr2e-5_singlepoint_fullpaqr_lr2e-5_8card"
  remove_unused_columns: false
  dataloader_num_workers: 6
  gradient_checkpointing: true
  max_grad_norm: 1.0
  deepspeed: "/workspace/code/VLN/scripts/zero2.json"

run:
  do_eval: false
  resume_from_checkpoint: false

wandb:
  project: "PanoVLN"
  entity: null
  name: "panovggt_0.20_lr2e-5_singlepoint_fullpaqr_lr2e-5_8card"
  tags: ["qwen3.5-4b", "r2r-rxr", "panovggt", "pre-merger", "singlepoint", "full-paqr", "decision-conditioned-query", "action-lm-head-semantics", "weak-learnable-circular-prior", "zero-init-output", "first-action-only", "action-bearing-disabled", "seed-42"]
  mode: "offline"
  group: null
  notes: "PanoVGGT + full PAQR from raw Qwen3.5-4B. For each left/forward/right candidate, PAQR combines the current navigation decision hidden state with the exact live action LM-head row, cross-attends to keys and values from the current panorama through a 256-d reader, adds a weak bounded physical circular prior, and corrects only the first movement-action logits through a zero-initialized output projection. Legacy action bearing remains disabled."
  id: null
  resume: "never"
